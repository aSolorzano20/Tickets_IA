<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formularios | Exámenes</title>
  <style>
    :root { --blue:#0071e3; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --bg:#f5f5f7; --white:#fff; --danger:#d70015; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#fbfbfd,var(--bg)); color:var(--ink); font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    .topbar { height:68px; background:rgba(255,255,255,.9); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 max(24px,calc((100% - 1080px)/2)); position:sticky; top:0; z-index:2; backdrop-filter:blur(12px); }
    .brand { font-weight:700; letter-spacing:-.03em; font-size:20px; }
    .brand span { color:var(--blue); }
    .user-menu { display:flex; align-items:center; gap:12px; color:var(--muted); }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--blue); font-weight:600; }
    main { max-width:1080px; margin:0 auto; padding:42px 24px 72px; }
    .page-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:32px; }
    h1 { font-size:34px; letter-spacing:-.04em; margin:0 0 8px; }
    h2 { font-size:22px; margin:0 0 18px; letter-spacing:-.02em; }
    h3 { margin:0 0 8px; font-size:17px; }
    p { color:var(--muted); margin:0; line-height:1.5; }
    .btn { border:0; border-radius:10px; padding:11px 17px; font-weight:600; transition:.2s; }
    .btn-primary { color:#fff; background:var(--blue); }
    .btn-primary:hover { background:#0062c4; }
    .btn-secondary { color:var(--ink); background:#e8e8ed; }
    .btn-plain { color:var(--blue); background:none; padding:8px 0; }
    .btn-danger { color:var(--danger); background:none; padding:8px 0; }
    .tabs { display:flex; gap:28px; border-bottom:1px solid var(--line); margin-bottom:28px; }
    .tab { border:0; border-bottom:2px solid transparent; padding:0 0 13px; color:var(--muted); background:none; font-weight:600; }
    .tab.active { color:var(--blue); border-color:var(--blue); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .card { background:var(--white); border:1px solid rgba(0,0,0,.06); border-radius:16px; padding:22px; box-shadow:0 5px 20px rgba(0,0,0,.035); }
    .exam-card { display:flex; flex-direction:column; gap:14px; min-height:180px; }
    .exam-card .card-footer { margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .badge { display:inline-flex; width:max-content; padding:5px 9px; border-radius:20px; color:#0062c4; background:#e8f2ff; font-size:12px; font-weight:600; }
    .empty { text-align:center; padding:50px 20px; grid-column:1/-1; }
    .empty strong { display:block; margin-bottom:8px; font-size:17px; }
    .form-card { max-width:760px; margin:auto; }
    .field { margin-bottom:20px; }
    label { display:block; font-weight:600; margin-bottom:8px; }
    input,textarea,select { width:100%; border:1px solid #d2d2d7; border-radius:10px; padding:11px 13px; background:#fff; color:var(--ink); outline:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #0071e31c; }
    textarea { resize:vertical; min-height:90px; }
    .question { border:1px solid var(--line); border-radius:13px; padding:17px; margin:14px 0; background:#fbfbfd; position:relative; }
    .question-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .question-number { color:var(--muted); font-weight:600; }
    .option-row { display:flex; gap:8px; margin-top:8px; }
    .option-row input { flex:1; }
    .remove-option { border:0; background:none; color:var(--muted); font-size:20px; }
    .form-actions { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:22px; margin-top:24px; }
    .notice { border-radius:10px; padding:12px 14px; background:#fff4ce; color:#765900; margin-bottom:18px; }
    .answer-option { display:flex; align-items:center; gap:9px; margin:9px 0; font-weight:400; }
    .answer-option input { width:auto; }
    .result-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px; }
    .metric { background:#f5f5f7; padding:16px; border-radius:12px; }
    .metric b { display:block; font-size:25px; margin-top:4px; }
    .response { border-top:1px solid var(--line); padding:16px 0; }
    .response:first-child { border-top:0; }
    .answer { margin-top:9px; padding:10px 12px; background:#f5f5f7; border-radius:8px; white-space:pre-wrap; }
    .hidden { display:none !important; }
    .back { margin-bottom:22px; }
    @media (max-width:620px) { main { padding:28px 16px 50px; } .page-heading { flex-direction:column; } h1 { font-size:29px; } .result-summary { grid-template-columns:1fr; } .topbar { padding:0 16px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Formularios<span>.</span></div>
    <div class="user-menu"><span id="userName"></span><span class="avatar" id="avatar"></span></div>
  </header>
  <main>
    <section id="app"></section>
  </main>
  <script>
    const STORAGE = { user: 'formularios_user', exams: 'formularios_exams', responses: 'formularios_responses' };
    const app = document.getElementById('app');
    let currentView = 'home';
    let selectedExamId = null;

    const read = key => JSON.parse(localStorage.getItem(key) || '[]');
    const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const getUser = () => localStorage.getItem(STORAGE.user);
    const ensureUser = () => {
      const name = getUser();
      if (!name) return false;
      document.getElementById('userName').textContent = name;
      document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
      return true;
    };
    function renderWelcome() {
      app.innerHTML = `<section class="card form-card" style="max-width:480px;text-align:center"><h1 style="font-size:28px">Bienvenido a Formularios</h1><p style="margin-bottom:24px">Crea y contesta exámenes compartidos con otros usuarios.</p><form id="welcomeForm"><div class="field" style="text-align:left"><label for="welcomeName">¿Cómo te llamas?</label><input id="welcomeName" name="welcomeName" required maxlength="80" placeholder="Tu nombre"></div><button class="btn btn-primary" style="width:100%">Continuar</button></form></section>`;
    }
    const empty = (title, text) => `<div class="card empty"><strong>${title}</strong><p>${text}</p></div>`;
    const examById = id => read(STORAGE.exams).find(exam => exam.id === id);

    function renderHome() {
      currentView = 'home';
      const exams = read(STORAGE.exams);
      const mine = exams.filter(exam => exam.owner === getUser());
      app.innerHTML = `
        <div class="page-heading"><div><h1>Mis formularios</h1><p>Crea exámenes y recibe respuestas de otros usuarios.</p></div><button class="btn btn-primary" data-action="create">+ Crear examen</button></div>
        <div class="tabs"><button class="tab active" data-action="home">Explorar formularios</button><button class="tab" data-action="mine">Mis exámenes (${mine.length})</button></div>
        <div id="examGrid" class="grid"></div>`;
      renderExamGrid(exams);
    }
    function renderExamGrid(exams) {
      const grid = document.getElementById('examGrid');
      grid.innerHTML = exams.length ? exams.map(exam => {
        const count = read(STORAGE.responses).filter(response => response.examId === exam.id).length;
        return `<article class="card exam-card"><span class="badge">${exam.questions.length} pregunta${exam.questions.length === 1 ? '' : 's'}</span><div><h3>${escapeHtml(exam.title)}</h3><p>${escapeHtml(exam.description || 'Sin descripción')}</p></div><div class="card-footer"><small>Creado por ${escapeHtml(exam.owner)}</small><button class="btn btn-primary" data-action="answer" data-id="${exam.id}">Contestar</button></div><small>${count} respuesta${count === 1 ? '' : 's'}</small></article>`;
      }).join('') : empty('Aún no hay formularios', 'Sé el primero en crear un examen para compartirlo.');
    }
    function renderMine() {
      const mine = read(STORAGE.exams).filter(exam => exam.owner === getUser());
      document.getElementById('examGrid').innerHTML = mine.length ? mine.map(exam => {
        const count = read(STORAGE.responses).filter(response => response.examId === exam.id).length;
        return `<article class="card exam-card"><span class="badge">${count} respuesta${count === 1 ? '' : 's'}</span><div><h3>${escapeHtml(exam.title)}</h3><p>${escapeHtml(exam.description || 'Sin descripción')}</p></div><div class="card-footer"><small>${exam.questions.length} preguntas</small><button class="btn btn-primary" data-action="results" data-id="${exam.id}">Ver resultados</button></div></article>`;
      }).join('') : empty('Todavía no tienes exámenes', 'Crea uno y compártelo con otros usuarios.');
    }
    function renderCreate() {
      currentView = 'create';
      app.innerHTML = `<button class="btn btn-plain back" data-action="home">← Volver a formularios</button><section class="card form-card"><h2>Crear examen</h2><p class="notice">El examen quedará disponible para todos los usuarios de esta aplicación.</p><form id="examForm"><div class="field"><label for="title">Título del examen</label><input id="title" name="title" required placeholder="Ej. Evaluación de matemáticas"></div><div class="field"><label for="description">Descripción <small>(opcional)</small></label><textarea id="description" name="description" placeholder="Explica de qué trata el formulario"></textarea></div><div id="questions"></div><button type="button" class="btn btn-secondary" data-action="add-question">+ Agregar pregunta</button><div class="form-actions"><button type="button" class="btn btn-plain" data-action="home">Cancelar</button><button class="btn btn-primary">Publicar examen</button></div></form></section>`;
      addQuestion();
    }
    function addQuestion() {
      const container = document.getElementById('questions');
      const index = container.children.length;
      const question = document.createElement('div');
      question.className = 'question';
      question.innerHTML = `<div class="question-head"><span class="question-number">Pregunta ${index + 1}</span>${index ? '<button type="button" class="btn-danger" data-action="remove-question">Eliminar</button>' : ''}</div><div class="field"><label>Texto de la pregunta</label><input name="question" required placeholder="Escribe tu pregunta"></div><div class="field"><label>Tipo de respuesta</label><select name="type"><option value="text">Respuesta corta</option><option value="long">Respuesta larga</option><option value="single">Opción múltiple</option></select></div><div class="options hidden"><label>Opciones</label><div class="option-list"><div class="option-row"><input name="option" placeholder="Opción 1"><button type="button" class="remove-option">×</button></div></div><button type="button" class="btn btn-plain add-option">+ Agregar opción</button></div>`;
      container.appendChild(question);
      question.querySelector('[name="type"]').addEventListener('change', event => {
        const isMultipleChoice = event.target.value === 'single';
        question.querySelector('.options').classList.toggle('hidden', !isMultipleChoice);
        question.querySelectorAll('[name="option"]').forEach(input => input.required = isMultipleChoice);
      });
      question.querySelector('.add-option').addEventListener('click', () => {
        const list = question.querySelector('.option-list'), number = list.children.length + 1;
        const row = document.createElement('div'); row.className = 'option-row'; row.innerHTML = `<input name="option" placeholder="Opción ${number}" required><button type="button" class="remove-option">×</button>`;
        list.appendChild(row);
      });
      question.addEventListener('click', event => { if (event.target.classList.contains('remove-option')) event.target.parentElement.remove(); });
    }
    function renderAnswer(id) {
      currentView = 'answer'; selectedExamId = id;
      const exam = examById(id);
      app.innerHTML = `<button class="btn btn-plain back" data-action="home">← Volver a formularios</button><section class="card form-card"><h2>${escapeHtml(exam.title)}</h2><p>${escapeHtml(exam.description || '')}</p><form id="answerForm"><div class="field"><label for="respondent">Tu nombre</label><input id="respondent" name="respondent" value="${escapeHtml(getUser())}" required></div>${exam.questions.map((question, index) => `<div class="question"><label>${index + 1}. ${escapeHtml(question.text)}</label>${question.type === 'single' ? question.options.map(option => `<label class="answer-option"><input type="radio" name="q${index}" value="${escapeHtml(option)}" required> ${escapeHtml(option)}</label>`).join('') : question.type === 'long' ? `<textarea name="q${index}" required placeholder="Escribe tu respuesta"></textarea>` : `<input name="q${index}" required placeholder="Tu respuesta">`}</div>`).join('')}<div class="form-actions"><span></span><button class="btn btn-primary">Enviar respuestas</button></div></form></section>`;
    }
    function renderResults(id) {
      currentView = 'results'; const exam = examById(id); const responses = read(STORAGE.responses).filter(response => response.examId === id);
      app.innerHTML = `<button class="btn btn-plain back" data-action="mine">← Volver a mis exámenes</button><section class="card"><h2>${escapeHtml(exam.title)}</h2><p>${escapeHtml(exam.description || '')}</p><div class="result-summary"><div class="metric"><span>Respuestas</span><b>${responses.length}</b></div><div class="metric"><span>Preguntas</span><b>${exam.questions.length}</b></div><div class="metric"><span>Última respuesta</span><b>${responses.length ? new Date(responses[responses.length - 1].createdAt).toLocaleDateString('es-MX') : '—'}</b></div></div><h3>Respuestas recibidas</h3><div>${responses.length ? responses.map(response => `<div class="response"><strong>${escapeHtml(response.respondent)}</strong><small> · ${new Date(response.createdAt).toLocaleString('es-MX')}</small>${response.answers.map((answer, index) => `<div><small>${index + 1}. ${escapeHtml(exam.questions[index].text)}</small><div class="answer">${escapeHtml(answer)}</div></div>`).join('')}</div>`).join('') : '<p>Aún no hay respuestas para este examen.</p>'}</div></section>`;
    }
    document.addEventListener('click', event => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      const id = event.target.closest('[data-id]')?.dataset.id;
      if (!action) return;
      if (action === 'home') renderHome();
      if (action === 'mine') { if (currentView !== 'home') renderHome(); else renderMine(); }
      if (action === 'create') renderCreate();
      if (action === 'add-question') addQuestion();
      if (action === 'remove-question') { event.target.closest('.question').remove(); document.querySelectorAll('.question-number').forEach((el, i) => el.textContent = `Pregunta ${i + 1}`); }
      if (action === 'answer') renderAnswer(id);
      if (action === 'results') renderResults(id);
    });
    document.addEventListener('submit', event => {
      event.preventDefault();
      if (event.target.id === 'welcomeForm') {
        const name = new FormData(event.target).get('welcomeName').trim();
        localStorage.setItem(STORAGE.user, name);
        ensureUser();
        renderHome();
        return;
      }
      if (event.target.id === 'examForm') {
        const data = new FormData(event.target), questions = [...document.querySelectorAll('#questions .question')].map(question => ({ text: question.querySelector('[name="question"]').value.trim(), type: question.querySelector('[name="type"]').value, options: [...question.querySelectorAll('[name="option"]')].map(input => input.value.trim()).filter(Boolean) }));
        if (!questions.length || questions.some(question => !question.text || (question.type === 'single' && question.options.length < 2))) return alert('Cada pregunta debe tener texto y las preguntas de opción múltiple necesitan al menos dos opciones.');
        const exams = read(STORAGE.exams); exams.push({ id: crypto.randomUUID(), title: data.get('title').trim(), description: data.get('description').trim(), owner: getUser(), questions, createdAt: new Date().toISOString() }); save(STORAGE.exams, exams); renderHome();
      }
      if (event.target.id === 'answerForm') {
        const data = new FormData(event.target), exam = examById(selectedExamId), answers = exam.questions.map((_, index) => data.get(`q${index}`));
        const responses = read(STORAGE.responses); responses.push({ id: crypto.randomUUID(), examId: selectedExamId, respondent: data.get('respondent').trim(), answers, createdAt: new Date().toISOString() }); save(STORAGE.responses, responses); app.innerHTML = `<section class="card empty"><strong>¡Respuestas enviadas!</strong><p>Gracias por completar “${escapeHtml(exam.title)}”.</p><button class="btn btn-primary" data-action="home" style="margin-top:20px">Explorar formularios</button></section>`;
      }
    });
    if (ensureUser()) renderHome(); else renderWelcome();
  </script>
</body>
</html>
